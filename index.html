<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>宇部市 赤ちゃんの駅MAP</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>

  <style>
    #map {
      height: 600px;
    }
  </style>
</head>

<body>

  <h1>宇部市 赤ちゃんの駅MAP</h1>

  <div id="map"></div>

  <script>
    // 宇部市周辺を中心に地図を表示
    const map = L.map('map').setView([33.95, 131.25], 13);

    // OpenStreetMapを背景地図として表示
    L.tileLayer(
      'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      {
        attribution: '&copy; OpenStreetMap contributors'
      }
    ).addTo(map);

    // GeoJSONを読み込む
    fetch('./data/ube_babystation.geojson')
      .then(response => response.json())
      .then(data => {

        L.geoJSON(data, {

          onEachFeature: function(feature, layer) {

            const p = feature.properties;

            layer.bindPopup(`
              <strong>${p.name}</strong><br>
              ${p.address}
            `);
          }

        }).addTo(map);

      });

  </script>

</body>
</html>
