<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>わたしのまちMAP</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
    }

    h1 {
      margin: 16px;
    }

    #map {
      height: 600px;
    }
  </style>
</head>

<body>

  <h1>わたしのまちMAP</h1>

  <div id="map"></div>

  <script>

    // 地図を作成
    // 最初は山口県付近を表示
    const map = L.map('map').setView([34.18, 131.47], 9);


    // OpenStreetMapを背景地図として表示
    L.tileLayer(
      'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      {
        attribution: '&copy; OpenStreetMap contributors'
      }
    ).addTo(map);


    // GeoJSONを読み込む
    fetch('./data/mapdata.geojson')

      .then(response => response.json())

      .then(data => {

        const geojsonLayer = L.geoJSON(data, {

          onEachFeature: function(feature, layer) {

            const p = feature.properties;

            // ポップアップの内容を作る
            let popup = '';

            if (p.name) {
              popup += `<strong>${p.name}</strong><br>`;
            }

            if (p.category) {
              popup += `カテゴリー：${p.category}<br>`;
            }

            if (p.address) {
              popup += `住所：${p.address}<br>`;
            }

            if (p.description) {
              popup += `${p.description}<br>`;
            }

            layer.bindPopup(popup);

          }

        }).addTo(map);


        // データ全体が見えるように地図を自動調整
        if (geojsonLayer.getBounds().isValid()) {
          map.fitBounds(geojsonLayer.getBounds());
        }

      })

      .catch(error => {
        console.error('GeoJSONの読み込みに失敗しました:', error);
      });

  </script>

</body>
</html>
